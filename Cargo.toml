# One Cargo workspace for every Rust crate in the repo: one Cargo.lock and one target/ folder,
# so the dependencies (tokio, axum, sqlx, reqwest, tauri...) build once for the server and the
# desktop shell instead of twice.

[workspace]
resolver = "2"
members = ["wed-alerts", "wed-base", "wed-calendar", "wed-drawings", "wed-engine", "wed-journal", "wed-plugins", "wed-scan", "wed-server", "src-tauri", "wed-store"]

[workspace.package]
version = "0.3.2"
edition = "2021"
rust-version = "1.77.2"
license-file = "LICENSE"
publish = false

# Versions shared by the crates (`dep.workspace = true` in a member).
[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
wednesday-base = { path = "wed-base" }
wednesday-scan = { path = "wed-scan" }
wednesday-store = { path = "wed-store" }
wednesday-journal = { path = "wed-journal" }
wednesday-engine = { path = "wed-engine" }
wednesday-alerts = { path = "wed-alerts" }
wednesday-calendar = { path = "wed-calendar" }
wednesday-drawings = { path = "wed-drawings" }
wednesday-plugins = { path = "wed-plugins" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17"
base64 = "0.22"
zip = { version = "4.2.0", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
log = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres"] }

# Debug builds stay light: line numbers for our own code (backtraces still point at lines),
# no debug info for dependencies. Debug info is most of target/ and of the link time.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
