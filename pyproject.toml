[project]
name = "wednesday"
version = "0.3.2"
description = "Wednesday: Smart Money Concepts screener for XAUUSD (order blocks, liquidity, inducement, quarterly theory) with a web dashboard and Telegram alerts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "fastapi>=0.115",
    "numpy>=1.26",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
desktop = ["keyring>=25"]  # the OS credential store, for the Telegram bot token

[project.scripts]
wednesday = "wednesday.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wednesday"]

[tool.pytest.ini_options]
testpaths = ["tests"]
