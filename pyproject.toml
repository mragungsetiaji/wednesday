[project]
name = "xau-screener"
version = "0.1.0"
description = "XAUUSD order block screener: 1-minute feed resampled to 5M/15M/30M/1H/4H, scanning nearest order blocks above and below price."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
xau-screener = "xau_screener.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xau_screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
