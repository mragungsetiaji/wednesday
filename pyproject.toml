[project]
name = "wednesday"
version = "0.1.3"
description = "Wednesday: Smart Money Concepts screener for XAUUSD (order blocks, liquidity, inducement, quarterly theory) with a web dashboard and Telegram alerts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "fastapi>=0.115",
    "numpy>=1.26",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'", "keyring>=25"]
postgres = ["psycopg[binary]>=3.1"]
llm = ["anthropic>=1.0", "openai>=1.0"]
ml = ["scikit-learn>=1.5", "pyarrow>=16"]
desktop = ["pywebview>=5", "keyring>=25"]

[project.scripts]
wednesday = "wednesday.cli:main"

[project.gui-scripts]
wednesday-desktop = "wednesday.desktop:run"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wednesday"]

[tool.pytest.ini_options]
testpaths = ["tests"]
