[package]
name = "wednesday-rs"
version.workspace = true
description = "Wednesday's server in Rust: serves the routes ported so far and passes the rest to the Python server (#96)"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "wednesday_rs"

[[bin]]
name = "wednesday-rs"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
axum.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util.workspace = true
log.workspace = true
reqwest.workspace = true
serde_json.workspace = true
wednesday-base.workspace = true
wednesday-scan.workspace = true
wednesday-store.workspace = true
wednesday-journal.workspace = true
wednesday-engine.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
wednesday-alerts.workspace = true
wednesday-calendar.workspace = true
wednesday-drawings.workspace = true
wednesday-plugins.workspace = true
argon2 = { version = "0.5", features = ["std"] }
scrypt = { version = "0.11", default-features = false }
rpassword = "7"
ring.workspace = true
base64.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
base64.workspace = true
flate2 = "1"
ring.workspace = true
zip.workspace = true
tokio = { version = "1", features = ["io-std", "macros", "net", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
