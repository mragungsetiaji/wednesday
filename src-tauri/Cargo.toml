[package]
name = "wednesday-desktop"
version = "0.2.0"
description = "Wednesday desktop shell: the dashboard in native windows, one per monitor"
edition = "2021"
rust-version = "1.77.2"
license-file = "../LICENSE"
publish = false

[lib]
name = "wednesday_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
log = "0.4"
