[package]
name = "wednesday-alerts"
version.workspace = true
description = "Wednesday's order block alerts on Telegram and the bot token in the OS credential store"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
log.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
wednesday-base.workspace = true
wednesday-engine.workspace = true
wednesday-scan.workspace = true
wednesday-store.workspace = true

# The OS credential store, where Python's keyring keeps the Telegram bot token (secrets.rs).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
