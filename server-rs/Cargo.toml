[package]
name = "wednesday-rs"
version.workspace = true
description = "Wednesday's server in Rust: serves the routes ported so far and passes the rest to the Python server (#96)"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "wednesday_rs"

[[bin]]
name = "wednesday-rs"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
log.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json.workspace = true
wednesday-base.workspace = true
wednesday-scan.workspace = true
wednesday-store.workspace = true
wednesday-journal.workspace = true
sqlx.workspace = true
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
ring = "0.17"
base64 = "0.22"
# Downloaded plugins (plugins/install.rs): Ed25519 and SHA-256 from ring (already here for rustls),
# zip archives read with flate2's pure-Rust backend.
zip = { version = "4.2.0", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# The OS credential store, where Python's keyring keeps the Telegram bot token (alerts/secrets.rs).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
flate2 = "1"
tokio = { version = "1", features = ["io-std", "macros", "net", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
