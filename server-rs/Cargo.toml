[package]
name = "wednesday-rs"
version = "0.3.2"
description = "Wednesday's server in Rust: serves the routes ported so far and passes the rest to the Python server (#96)"
edition = "2021"
rust-version = "1.77.2"
license-file = "../LICENSE"
publish = false

[lib]
name = "wednesday_rs"

[[bin]]
name = "wednesday-rs"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
log = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
flate2 = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
