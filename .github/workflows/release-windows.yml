# Windows desktop app: builds the WednesdaySetup-<version>.exe installer.
# Push a tag like v0.2.0 to publish it on a GitHub release; run it by hand
# (Actions > Release Windows > Run workflow) for a test build kept as a workflow artifact.
# After a tagged build, the bump-main job writes the tag's version into pyproject.toml,
# src/wednesday/__init__.py, uv.lock and web/package(-lock).json on main (scripts/set_version.py).
name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $base = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
            $version = "$base-dev.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          # Every file that carries the version, for this build (the app shows it in its status bar).
          python scripts/set_version.py $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --frozen --no-dev --extra desktop --extra mt5 --extra llm --extra ml

      - name: Build app (PyInstaller)
        run: uv run --frozen --no-dev --with pyinstaller pyinstaller packaging/wednesday.spec --noconfirm

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\wednesday.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: wednesday-windows-${{ steps.version.outputs.version }}
          path: |
            dist/WednesdaySetup-*.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WednesdaySetup-*.exe
          generate_release_notes: true

  # Keep main's files on the released version, so running from source shows it too.
  bump-main:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write the version on main
        run: |
          python3 scripts/set_version.py "$GITHUB_REF_NAME" --if-newer
          if git diff --quiet; then
            echo "main already has ${GITHUB_REF_NAME#v} or newer"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Version ${GITHUB_REF_NAME#v}"
          git pull --rebase origin main
          git push origin HEAD:main
