# Windows desktop app: builds the WednesdaySetup-<version>.exe installer with the Tauri shell (#92).
# Push a tag like v0.3.1 to publish it on a GitHub release; run it by hand
# (Actions > Release Windows > Run workflow) for a test build kept as a workflow artifact.
#
# The shell (src-tauri) starts the Python server as a sidecar: PyInstaller builds it as
# dist/wednesday-server/ (packaging/wednesday.spec), and
# tauri.release.conf.json bundles that folder into the NSIS installer's resources.
#
# After a tagged build, the bump-main job writes the tag's version into every file that carries
# it on main (scripts/set_version.py).
name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $base = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
            $version = "$base-dev.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          # Every file that carries the version, for this build (the app shows it in its status
          # bar; tauri.conf.json and Cargo.toml give the installer its version).
          python scripts/set_version.py $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tradingview/package-lock.json

      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build

      # The TradingView data source: its helper and the node.exe that runs it ship with the server.
      - name: Bundle Node and the TradingView helper
        shell: pwsh
        run: |
          npm ci --omit=dev --prefix tradingview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $node = (Get-Command node).Source
          New-Item -ItemType Directory -Force packaging\node | Out-Null
          Copy-Item $node packaging\node\node.exe
          $license = Join-Path (Split-Path $node) LICENSE
          if (Test-Path $license) {
            Copy-Item $license packaging\node\LICENSE
          } else {
            Invoke-WebRequest "https://raw.githubusercontent.com/nodejs/node/$(node -v)/LICENSE" -OutFile packaging\node\LICENSE
          }
          & packaging\node\node.exe -v

      - uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --frozen --no-dev --extra desktop

      - name: Build the server (PyInstaller)
        run: uv run --frozen --no-dev --with pyinstaller pyinstaller packaging/wednesday.spec --noconfirm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the installer (Tauri, NSIS)
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo tauri build --config tauri.release.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The name the README and earlier releases use.
          $setup = Get-ChildItem target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "No NSIS installer in target\release\bundle\nsis"; exit 1 }
          New-Item -ItemType Directory -Force ..\dist | Out-Null
          Copy-Item $setup.FullName "..\dist\WednesdaySetup-${{ steps.version.outputs.version }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: wednesday-windows-${{ steps.version.outputs.version }}
          path: dist/WednesdaySetup-*.exe

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WednesdaySetup-*.exe
          generate_release_notes: true

  # Keep main's files on the released version, so running from source shows it too.
  bump-main:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write the version on main
        run: |
          version="${GITHUB_REF_NAME#[vV]}"
          python3 scripts/set_version.py "$version" --if-newer
          if git diff --quiet; then
            echo "main already has $version or newer"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Version $version"
          git pull --rebase origin main
          git push origin HEAD:main
