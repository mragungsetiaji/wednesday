# Tauri desktop shell for Windows (#92, phase 2): a test installer, kept as a workflow artifact.
# Run it by hand (Actions > Tauri Windows > Run workflow). The released installer still comes
# from release-windows.yml until this one has been tried on real machines.
#
# The shell (src-tauri) starts the Python server as a sidecar: PyInstaller builds it as
# dist/wednesday-server/ (packaging/wednesday.spec with WEDNESDAY_BUILD=server), and
# tauri.release.conf.json bundles that folder into the installer's resources.
name: Tauri Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          $base = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $version = "$base-dev.$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          python scripts/set_version.py $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tradingview/package-lock.json

      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build

      # The TradingView data source: its helper and the node.exe that runs it ship with the server.
      - name: Bundle Node and the TradingView helper
        shell: pwsh
        run: |
          npm ci --omit=dev --prefix tradingview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $node = (Get-Command node).Source
          New-Item -ItemType Directory -Force packaging\node | Out-Null
          Copy-Item $node packaging\node\node.exe
          $license = Join-Path (Split-Path $node) LICENSE
          if (Test-Path $license) {
            Copy-Item $license packaging\node\LICENSE
          } else {
            Invoke-WebRequest "https://raw.githubusercontent.com/nodejs/node/$(node -v)/LICENSE" -OutFile packaging\node\LICENSE
          }

      - uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --frozen --no-dev --extra desktop --extra llm --extra ml

      - name: Build the server (PyInstaller)
        env:
          WEDNESDAY_BUILD: server
        run: uv run --frozen --no-dev --with pyinstaller pyinstaller packaging/wednesday.spec --noconfirm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the installer (Tauri, NSIS)
        working-directory: src-tauri
        shell: pwsh
        run: |
          # The Version step already wrote the version into tauri.conf.json and Cargo.toml (set_version.py).
          cargo tauri build --config tauri.release.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: wednesday-tauri-windows-${{ steps.version.outputs.version }}
          path: src-tauri/target/release/bundle/nsis/*.exe
